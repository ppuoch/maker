[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loaf-r2-bot"
version = "1.0.0"
description = "Production Patient Maker bot for Loaf Markets League of Loaf Round 2"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
loaf-bot = "loaf_bot.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["loaf_bot*"]
